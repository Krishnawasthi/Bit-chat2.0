# ─────────────────────────────────────────────────────────────────────
# Indian Mesh — Gradle Version Catalog
# ─────────────────────────────────────────────────────────────────────
# Central declaration of every dependency version used across all modules.
# Modules reference these via `libs.<alias>` in their build.gradle.kts.
# ─────────────────────────────────────────────────────────────────────

[versions]
# ── Build Tools ──────────────────────────────────────────────────────
agp = "8.7.0"

# ── Android SDK ──────────────────────────────────────────────────────
minSdk = "26"
targetSdk = "35"
compileSdk = "35"

# ── Java & Kotlin ────────────────────────────────────────────────────
javaVersion = "17"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.25"

# ── Compose ──────────────────────────────────────────────────────────
compose-bom = "2024.10.00"
compose-compiler = "1.5.15"
activity-compose = "1.9.3"
lifecycle-compose = "2.8.7"
navigation-compose = "2.8.3"
hilt-navigation-compose = "1.2.0"

# ── AndroidX Core ────────────────────────────────────────────────────
core-ktx = "1.15.0"
appcompat = "1.7.0"
activity = "1.9.3"
fragment = "1.8.5"
material = "1.12.0"
constraintlayout = "2.2.0"
recyclerview = "1.4.0"
swiperefreshlayout = "1.1.0"
viewpager2 = "1.1.0"
cardview = "1.0.0"
splashscreen = "1.0.1"

# ── Architecture Components ─────────────────────────────────────────
lifecycle = "2.8.7"
navigation = "2.8.5"
room = "2.6.1"
work = "2.10.0"
datastore = "1.1.1"

# ── Dependency Injection ─────────────────────────────────────────────
hilt = "2.53.1"
hilt-work = "1.2.0"

# ── Reactive / Concurrency ──────────────────────────────────────────
rxjava = "3.1.9"
rxandroid = "3.0.2"

# ── Security / Crypto ───────────────────────────────────────────────
security-crypto = "1.1.0-alpha06"
bouncycastle = "1.79"
sqlcipher = "4.6.1"
sqlite = "2.4.0"

# ── Image Loading ───────────────────────────────────────────────────
glide = "4.16.0"

# ── QR Code ─────────────────────────────────────────────────────────
zxing = "3.5.3"
zxing-embedded = "4.3.0"

# ── Annotations ─────────────────────────────────────────────────────
annotations = "1.9.1"

# ── Testing ─────────────────────────────────────────────────────────
junit = "4.13.2"
junit-ext = "1.2.1"
mockito = "5.14.2"
mockito-inline = "5.2.0"
truth = "1.4.4"
espresso = "3.6.1"
robolectric = "4.14.1"
arch-core-testing = "2.2.0"
test-runner = "1.6.2"
test-rules = "1.6.1"
leakcanary = "2.14"

[libraries]
# ── AndroidX Core ────────────────────────────────────────────────────
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-viewpager2 = { module = "androidx.viewpager2:viewpager2", version.ref = "viewpager2" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-annotations = { module = "androidx.annotation:annotation", version.ref = "annotations" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# ── Lifecycle ────────────────────────────────────────────────────────
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-livedata = { module = "androidx.lifecycle:lifecycle-livedata", version.ref = "lifecycle" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "lifecycle" }
lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "lifecycle" }

# ── Navigation ───────────────────────────────────────────────────────
navigation-fragment = { module = "androidx.navigation:navigation-fragment", version.ref = "navigation" }
navigation-ui = { module = "androidx.navigation:navigation-ui", version.ref = "navigation" }

# ── Room ─────────────────────────────────────────────────────────────
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-rxjava3 = { module = "androidx.room:room-rxjava3", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# ── WorkManager ──────────────────────────────────────────────────────
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
work-rxjava3 = { module = "androidx.work:work-rxjava3", version.ref = "work" }
work-testing = { module = "androidx.work:work-testing", version.ref = "work" }

# ── DataStore ────────────────────────────────────────────────────────
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# ── Hilt ─────────────────────────────────────────────────────────────
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-work = { module = "androidx.hilt:hilt-work", version.ref = "hilt-work" }
hilt-work-compiler = { module = "androidx.hilt:hilt-compiler", version.ref = "hilt-work" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# ── Compose ──────────────────────────────────────────────────────────
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle-compose" }
navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# ── Reactive / Concurrency ──────────────────────────────────────────
rxjava3 = { module = "io.reactivex.rxjava3:rxjava", version.ref = "rxjava" }
rxandroid3 = { module = "io.reactivex.rxjava3:rxandroid", version.ref = "rxandroid" }

# ── Security / Crypto ───────────────────────────────────────────────
security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }

# ── Image Loading ───────────────────────────────────────────────────
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }

# ── QR Code ─────────────────────────────────────────────────────────
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-embedded" }

# ── Testing ─────────────────────────────────────────────────────────
junit = { module = "junit:junit", version.ref = "junit" }
junit-ext = { module = "androidx.test.ext:junit", version.ref = "junit-ext" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-inline = { module = "org.mockito:mockito-inline", version.ref = "mockito-inline" }
mockito-android = { module = "org.mockito:mockito-android", version.ref = "mockito" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
arch-core-testing = { module = "androidx.arch.core:core-testing", version.ref = "arch-core-testing" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }

[bundles]
lifecycle = [
    "lifecycle-viewmodel",
    "lifecycle-livedata",
    "lifecycle-runtime",
    "lifecycle-service",
    "lifecycle-process",
    "lifecycle-common-java8",
]
navigation = ["navigation-fragment", "navigation-ui"]
room = ["room-runtime", "room-rxjava3"]
ui-core = [
    "androidx-appcompat",
    "androidx-activity",
    "androidx-fragment",
    "material",
    "androidx-constraintlayout",
    "androidx-recyclerview",
    "androidx-cardview",
]
testing-unit = ["junit", "mockito-core", "mockito-inline", "truth"]
testing-android = [
    "junit-ext",
    "mockito-android",
    "espresso-core",
    "test-runner",
    "test-rules",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
navigation-safeargs = { id = "androidx.navigation.safeargs", version.ref = "navigation" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
