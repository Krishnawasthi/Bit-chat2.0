# ─────────────────────────────────────────────────────────────────────
# Indian Mesh — Gradle Properties
# ─────────────────────────────────────────────────────────────────────

# Project-wide Gradle settings.

# AndroidX package structure
android.useAndroidX=true

# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself and none from dependencies.
android.nonTransitiveRClass=true

# Enable build cache for faster incremental builds
org.gradle.caching=true

# Enable parallel module builds
org.gradle.parallel=true

# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable configuration cache for faster configuration phase
org.gradle.configuration-cache=true

# Kotlin DSL code style
kotlin.code.style=official
